<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Projeto 1/100</title>
</head>

<body>
  <div class="card">
    <h1>Calcule seu <strong>IMC</strong></h1>
    <p>Digite seu peso e altura.</p>
    <input type="number" id="peso" placeholder="Peso (kg)" step="0.1" min="0">
    <br>
    <input type="number" id="altura" placeholder="Altura (m)" step="0.01" min="0">
    <br>
    <button onclick="calcularIMC()">Calcular IMC</button>

    <div id="resultado"></div>
  </div>

  <script>
    function calcularIMC() {
      const peso = parseFloat(document.getElementById('peso').value);
      const altura = parseFloat(document.getElementById('altura').value);

      if (isNaN(peso) || isNaN(altura) || peso <= 0 || altura <= 0) {
        document.getElementById('resultado').innerHTML = "Por favor, insira valores válidos.";
        return;
      }

      const imc = peso / (altura ** 2);
      let categoria = "";

      if (imc < 18.5) {
        categoria = "Abaixo do peso";
      } else if (imc < 24.9) {
        categoria = "Peso normal";
      } else if (imc < 29.9) {
        categoria = "Sobrepeso";
      } else {
        categoria = "Obesidade";
      }

      document.getElementById('resultado').innerHTML = `Seu IMC é: ${imc.toFixed(2)}<br>Categoria: ${categoria}`;
    }
  </script>

</body>

</html>
